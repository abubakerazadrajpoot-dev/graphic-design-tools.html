<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dad's Memories</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root { --primary-gold: #D4AF37; --dark-bg: #0A0A0F; --text-light: #F0F0F0; }
        body { font-family: 'Inter', sans-serif; background: #0A0A0F; color: var(--text-light); overflow-x: hidden; }
        
        .preloader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--dark-bg); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 9999;
            transition: opacity 0.5s ease;
        }
        .preloader.hidden { opacity: 0; pointer-events: none; }
        .loader-ring { width: 60px; height: 60px; border: 4px solid rgba(212, 175, 55, 0.1); border-top: 4px solid var(--primary-gold); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .navbar { padding: 20px; text-align: center; background: rgba(255,255,255,0.05); backdrop-filter: blur(10px); }
        .logo { font-family: 'Playfair Display', serif; font-size: 1.5rem; color: var(--primary-gold); }
        
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; padding: 40px 20px; }
        .gallery-item { border-radius: 15px; overflow: hidden; height: 300px; border: 1px solid rgba(212,175,55,0.2); }
        .gallery-item img { width: 100%; height: 100%; object-fit: cover; }
    </style>
</head>
<body>

    <div class="preloader" id="preloader">
        <div class="loader-ring"></div>
        <p style="margin-top:20px; color:var(--primary-gold);">Opening Gallery...</p>
    </div>

    <nav class="navbar">
        <div class="logo">📸 Dad's Memories</div>
    </nav>

    <div class="gallery-grid" id="galleryGrid"></div>

    <script>
        const images = [
            { src: "https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=500", title: "Nature" },
            { src: "https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=500", title: "Lake" },
            { src: "https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?w=500", title: "Mountain" }
        ];

        // Sirf 1 second baad loading khatam ho jayegi
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('preloader').classList.add('hidden');
            }, 1000); 
        });

        const grid = document.getElementById('galleryGrid');
        grid.innerHTML = images.map(img => `
            <div class="gallery-item">
                <img src="${img.src}" alt="${img.title}">
            </div>
        `).join('');
    </script>
</body>
</html>
