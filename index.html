<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎨 Free Graphic Design Tools</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 50%, #4facfe 100%);
            min-height: 100vh;
            color: #333;
            overflow-x: hidden;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(20px);
            padding: 30px;
            border-radius: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }

        h1 {
            font-size: 3.5em;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4, #45b7d1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 1.3em;
            color: #666;
            margin-bottom: 20px;
        }

        .search-box {
            max-width: 600px;
            margin: 0 auto 40px;
            display: flex;
            gap: 15px;
        }

        #searchInput {
            flex: 1;
            padding: 18px 25px;
            border: 3px solid #e0e0e0;
            border-radius: 50px;
            font-size: 16px;
            outline: none;
            transition: all 0.3s ease;
            background: white;
        }

        #searchInput:focus {
            border-color: #4ecdc4;
            box-shadow: 0 0 20px rgba(78, 205, 196, 0.3);
        }

        .search-btn {
            padding: 18px 30px;
            background: linear-gradient(45deg, #4ecdc4, #44a08d);
            border: none;
            border-radius: 50px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .search-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(78, 205, 196, 0.4);
        }

        .tools-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 30px;
            margin-bottom: 50px;
        }

        .tool-card {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(20px);
            border-radius: 25px;
            padding: 30px;
            text-align: center;
            transition: all 0.4s ease;
            border: 1px solid rgba(255,255,255,0.3);
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            position: relative;
            overflow: hidden;
        }

        .tool-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            transition: left 0.5s;
        }

        .tool-card:hover::before {
            left: 100%;
        }

        .tool-card:hover {
            transform: translateY(-15px) scale(1.02);
            box-shadow: 0 25px 50px rgba(0,0,0,0.2);
        }

        .tool-icon {
            font-size: 4em;
            margin-bottom: 20px;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .tool-title {
            font-size: 1.8em;
            font-weight: bold;
            margin-bottom: 15px;
            color: #333;
        }

        .tool-desc {
            color: #666;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .tool-links {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn-primary {
            background: linear-gradient(45deg, #4ecdc4, #44a08d);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.3s ease;
            display: inline-block;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(78, 205, 196, 0.4);
        }

        .btn-secondary {
            background: transparent;
            color: #4ecdc4;
            border: 2px solid #4ecdc4;
            padding: 10px 20px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .btn-secondary:hover {
            background: #4ecdc4;
            color: white;
        }

        .color-picker {
            margin: 40px 0;
            text-align: center;
            background: rgba(255,255,255,0.95);
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
        }

        .color-input {
            width: 100px;
            height: 100px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            margin: 0 10px;
            transition: transform 0.3s ease;
        }

        .color-input:hover {
            transform: scale(1.1);
        }

        .categories {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 40px 0;
            flex-wrap: wrap;
        }

        .category-btn {
            padding: 12px 25px;
            background: rgba(255,255,255,0.3);
            border: 2px solid rgba(255,255,255,0.5);
            border-radius: 30px;
            color: white;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .category-btn.active,
        .category-btn:hover {
            background: white;
            color: #333;
            transform: translateY(-3px);
        }

        @media (max-width: 768px) {
            h1 { font-size: 2.5em; }
            .tools-grid { grid-template-columns: 1fr; }
            .search-box { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="Pubg.jpg" alt="PUBG" style="width: 100%; max-width: 600px; display: block; margin: 0 auto 20px auto; border-radius: 15px;">
        <header>
            <h1>🎨 ABUBAKAR Design Hub</h1>
            <p class="subtitle">Free tools, templates, mockups & resources for designers</p>
        </header>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search tools... (Logo, Mockup, Color, Template)">
            <button class="search-btn" onclick="searchTools()">🔍 Search</button>
        </div>

        <div class="categories">
            <button class="category-btn active" onclick="filterCategory('all')">All Tools</button>
            <button class="category-btn" onclick="filterCategory('logo')">Logo Design</button>
            <button class="category-btn" onclick="filterCategory('mockup')">Mockups</button>
            <button class="category-btn" onclick="filterCategory('template')">Templates</button>
            <button class="category-btn" onclick="filterCategory('color')">Colors</button>
            <button class="category-btn" onclick="filterCategory('font')">Fonts</button>
        </div>

        <div class="tools-grid" id="toolsGrid">
            <!-- Tools populated by JavaScript -->
        </div>

        <div class="color-picker">
            <h3 style="margin-bottom: 20px; color: #333;">🎨 Quick Color Picker</h3>
            <input type="color" class="color-input" value="#ff6b6b" onchange="updateColor(this.value)">
            <input type="color" class="color-input" value="#4ecdc4" onchange="updateColor(this.value)">
            <input type="color" class="color-input" value="#45b7d1" onchange="updateColor(this.value)">
            <input type="color" class="color-input" value="#f9ca24" onchange="updateColor(this.value)">
            <input type="color" class="color-input" value="#6c5ce7" onchange="updateColor(this.value)">
            <div id="colorValue" style="margin-top: 20px; font-size: 1.2em; font-weight: bold; color: #333;"></div>
        </div>
    </div>

    <script>
        const tools = [
            {
                id: 1, name: "Logo Maker", category: "logo",
                desc: "Free AI logo generator with 1000+ templates", 
                icon: "🎨", links: {
                    use: "https://www.canva.com/create/logos/",
                    download: "https://logomakr.com/"
                }
            },
            {
                id: 2, name: "Device Mockups", category: "mockup",
                desc: "Free PSD mockups for phones, laptops & tablets", 
                icon: "📱", links: {
                    use: "https://mockups-design.com/",
                    download: "https://www.mockupworld.co/"
                }
            },
            {
                id: 3, name: "Social Media Templates", category: "template",
                desc: "Instagram, Facebook & Twitter post templates", 
                icon: "📸", links: {
                    use: "https://www.canva.com/social-graphics/templates/",
                    download: "https://www.freepik.com/"
                }
            },
            {
                id: 4, name: "Color Palette Generator", category: "color",
                desc: "Generate perfect color schemes instantly", 
                icon: "🌈", links: {
                    use: "https://coolors.co/",
                    download: "https://colorhunt.co/"
                }
            },
            {
                id: 5, name: "Google Fonts", category: "font",
                desc: "1000+ free professional fonts for your projects", 
                icon: "🔤", links: {
                    use: "https://fonts.google.com/",
                    download: "https://fontjoy.com/"
                }
            },
            {
                id: 6, name: "Business Card Maker", category: "logo",
                desc: "Professional business card templates & mockups", 
                icon: "💳", links: {
                    use: "https://www.canva.com/create/business-cards/",
                    download: "https://placeit.net/business-card-mockups"
                }
            },
            {
                id: 7, name: "T-Shirt Mockups", category: "mockup",
                desc: "Free apparel mockups for merchandise design", 
                icon: "👕", links: {
                    use: "https://smartmockups.com/tshirt-mockups",
                    download: "https://www.mockupworld.co/free/"
                }
            },
            {
                id: 8, name: "Poster Templates", category: "template",
                desc: "Event posters, flyers & banner templates", 
                icon: "📜", links: {
                    use: "https://www.canva.com/posters/templates/",
                    download: "https://www.vecteezy.com/free-vector/poster"
                }
            }
        ];

        function renderTools(toolList = tools) {
            const grid = document.getElementById('toolsGrid');
            grid.innerHTML = '';

            toolList.forEach(tool => {
                const card = document.createElement('div');
                card.className = 'tool-card';
                card.innerHTML = `
                    <div class="tool-icon">${tool.icon}</div>
                    <div class="tool-title">${tool.name}</div>
                    <div class="tool-desc">${tool.desc}</div>
                    <div class="tool-links">
                        <a href="${tool.links.use}" target="_blank" class="btn-primary">Use Now</a>
                        <a href="${tool.links.download}" target="_blank" class="btn-secondary">Download</a>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function searchTools() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = tools.filter(tool => 
                tool.name.toLowerCase().includes(query) || 
                tool.desc.toLowerCase().includes(query) ||
                tool.category.includes(query)
            );
            renderTools(filtered);
        }

        function filterCategory(category) {
            document.querySelectorAll('.category-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            if (category === 'all') {
                renderTools(tools);
            } else {
                const filtered = tools.filter(tool => tool.category === category);
                renderTools(filtered);
            }
        }

        function updateColor(color) {
            document.getElementById('colorValue').textContent = `Current Color: ${color} 📋 Copy HEX`;
            document.getElementById('colorValue').style.color = color;
        }

        // Event listeners
        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') searchTools();
        });

        document.getElementById('colorValue').addEventListener('click', function() {
            const color = this.textContent.match(/#[\w\d]{6}/)[0];
            navigator.clipboard.writeText(color);
            this.textContent = `Copied ${color} ✅`;
            setTimeout(() => {
                this.textContent = `Current Color: ${color} 📋 Copy HEX`;
            }, 2000);
        });

        // Initial render
        renderTools();
    </script>
</body>
</html>
